scheme: pn/1
class: enclosure-reference
name: Enclosure reference - 550 x 550 x 440 stacking trunk
description: >-
  Blow-moulded polyethylene stacking trunk, 550 x 550 x 440, of the kind
  sold for modular pallet loads, that the dincase shelf fits
  into. Single wall, 3-4 mm thick, so every feature pressed into the
  outside stands into the inside too. The mould seam runs round the case
  about 100 mm below the top and the walls draft away from it both ways.
  550 x 550 footprint so four make a layer on a pallet, 440 high, front
  door in a 550 x 440 face (the door, a separate double-wall panel, is not
  modelled). Long sloped studs on top seat in matching sockets underneath
  the trunk above. Vertical channels in the side walls stiffen them and
  hold the pallet straps. Modelled in its natural orientation; mounting it
  on its side is a rotation in the assembly. Not a part we make; modelled
  so mounts can be designed around it.
# Sources: PUB = product pages (inside 495 L x 500 W x 410 H); OWN = owner's
# description; MEAS = owner's measurement (owner photos);
# EST = estimate from product photos, to be measured.
# Axes: X across the door, Y up, Z out of the door (front +).
parameters:
  outer_w_mm: 550          # A  PUB - across the door face, at the seam
  outer_h_mm: 440          # B  PUB - underside to the top skin (the studs
                           #    stand above)
  outer_d_mm: 550          # C  PUB - front to back, at the seam
  wall_mm: 3.5             # D  OWN - single wall, 3-4 mm
  seam_from_top_mm: 100    # E  OWN - mould parting line below the top
  draft_deg: 1.5           # F  EST - walls taper away from the seam
  opening_w_mm: 493        # G  MEAS - across
  opening_h_mm: 372        # H  MEAS - high
  clear_top_mm: 25         # K  MEAS - opening top edge up to the frame
                           #    header behind it
  clear_base_mm: 6         # K  MEAS - opening bottom edge down to the
                           #    highest floor (the socket ridges inside)
  header_d_mm: 30          # J  EST - frame header depth behind the door,
                           #    front to back
  # Stacking: long studs on top, front to back, sides and ends sloped so
  # they release from the mould and seat without jamming; matching
  # sockets underneath.
  stud_w_mm: 50            # S  EST - width at the base
  stud_len_mm: 470         # U  EST - length at the base
  stud_h_mm: 20            # V  EST - height above the top skin
  stud_pitch_mm: 220       # X  EST - centre to centre across, 3 off
  stud_slope_deg: 20       # W  EST - side and end slope from vertical
  socket_clear_mm: 2       # Y  EST - socket bigger than the stud all round
  socket_depth_mm: 22      # Y  EST - into the base (stud + 2)
  # Side walls: vertical strap channels in from each corner, and a handle
  # pocket between them.
  strap_from_corner_mm: 70 # N  EST - front/back face to channel centre
  strap_w_mm: 45           # N  EST - channel width
  strap_depth_mm: 12       # N  EST - channel depth
  handle_w_mm: 110         # P  EST - pocket width, front to back
  handle_h_mm: 140         # Q  EST - pocket height
  handle_depth_mm: 18      # R  EST - pocket depth at the seam
  handle_from_top_mm: 150  # T  EST - top to the pocket centre (centred
                           #    front to back)
appearance:
  colour: [0.35, 0.45, 0.65]
files:
  - build_trunk.py
  - swkit.py
